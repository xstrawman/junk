# Flatpak: build junk from git source (needs network during cargo build).
# Not Flathub-ready (Flathub wants vendored/offline cargo-sources.json).
# Good for local/dev installs from a checkout.
#
# From repo root:
#   flatpak-builder --user --install --force-clean \
#     --state-dir=.flatpak-builder packaging/flatpak/build-src \
#     packaging/flatpak/dev.xstrawman.Junk.from-source.yml

app-id: dev.xstrawman.Junk
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: junk

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/junk/cargo
    RUSTFLAGS: "-C strip=symbols"

finish-args:
  - --share=network
  - --filesystem=xdg-download:create
  - --filesystem=/run/media:create
  - --filesystem=/media:create
  - --filesystem=/mnt:create
  - --filesystem=home

modules:
  - name: junk
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked -p junk
      - install -Dm755 target/release/junk /app/bin/junk
      - install -Dm644 packaging/flatpak/dev.xstrawman.Junk.desktop /app/share/applications/dev.xstrawman.Junk.desktop
      - install -Dm644 packaging/flatpak/dev.xstrawman.Junk.metainfo.xml /app/share/metainfo/dev.xstrawman.Junk.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/junk/LICENSE
    sources:
      - type: dir
        path: ../..
