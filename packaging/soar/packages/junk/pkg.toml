# Soar / soarpkgs package definition for junk
# Format: https://github.com/pkgforge/soarpkgs/blob/main/docs/FORMAT.md
#
# Install (after a GitHub Release exists):
#   soar add https://github.com/xstrawman/junk/releases/download/v0.1.0/junk-x86_64-unknown-linux-musl
#
# Or once merged into soarpkgs:
#   soar install junk

[pkg]
name        = "junk"
type        = "static"
description = "Super-fast multi-connection HTTP(S) downloader — CLI + neon arcade TUI (syringe → arm). Distrohopper: ISO straight to Ventoy."
homepage    = ["https://github.com/xstrawman/junk"]
license     = ["MIT"]
maintainer  = ["xstrawman"]
category    = ["ConsoleOnly", "Network", "Utility"]
note        = "Identity is a temporary filesystem. Use: junk --ventoy <iso-url>"
provides    = ["junk"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "xstrawman/junk"
strip-prefix = "v"

# Single portable musl binary per arch (no archive).
[source]
url = "https://github.com/xstrawman/junk/releases/download/v${version}/junk-${arch}-unknown-linux-musl"

[[extra]]
url    = "https://raw.githubusercontent.com/xstrawman/junk/master/LICENSE"
to     = "LICENSE"
verify = false
